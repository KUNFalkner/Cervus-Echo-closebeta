## 校园树洞 —— nginx 反向代理（标准 80 端口）
##
## 设计取舍：静态文件不由 nginx 直接读盘，而是整体反代给后端。
## 原因是项目路径含中文（E:/mimo code 树洞设计/），Windows 版 nginx 对
## 非 ASCII 路径的处理不可靠；后端本就已托管 dist/ 与 /avatars，
## 全量反代可彻底规避编码问题。当前规模下多一跳的开销可忽略。
##
## 启动：nginx -p <本目录> -c <本文件>
## 重载：nginx -p <本目录> -c <本文件> -s reload
## 停止：nginx -p <本目录> -c <本文件> -s stop

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # 反代模式下响应的 Content-Type 由后端决定，这里仅作兜底。
    # include 按「本配置文件所在目录」解析；本文件位于 conf/treehole/，
    # 故需回退一层才能取到 nginx 自带的 conf/mime.types
    include       ../mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 头像原图上传前不压缩，放宽单请求体积上限
    client_max_body_size 10m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # WebSocket 需要按 Upgrade 头切换 Connection 值：
    # 普通请求必须发 close，否则连接会被错误地挂起
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream treehole_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        access_log  logs/treehole.access.log;
        error_log   logs/treehole.error.log;

        # 聊天室 WebSocket：不能有读超时，否则空闲连接会被掐断
        location /ws/ {
            proxy_pass         http://treehole_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }

        # 用户头像：会被覆盖更新，缓存要短且必须回源校验
        location /avatars/ {
            proxy_pass       http://treehole_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header       Cache-Control "public, max-age=60, must-revalidate";
        }

        # 帖子图片：文件名是 uuid，永不变，可长缓存
        location /uploads/ {
            proxy_pass       http://treehole_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header       Cache-Control "public, max-age=86400, immutable";
        }

        # 塔罗牌面：内容永不变，可长缓存
        location /tarot/ {
            proxy_pass       http://treehole_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header       Cache-Control "public, max-age=2592000, immutable";
        }

        # 构建产物带内容哈希，可长缓存
        location /assets/ {
            proxy_pass       http://treehole_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header       Cache-Control "public, max-age=2592000, immutable";
        }

        # 接口一律不缓存
        location /api/ {
            proxy_pass       http://treehole_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            add_header       Cache-Control "no-store";
        }

        # 其余（SPA 入口与前端路由）交给后端兜底返回 index.html
        location / {
            proxy_pass       http://treehole_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
